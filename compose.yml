services:
  beatrice:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      ollama:
        condition: service_healthy
      otel-healthcheck:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      qwen-tts:
        condition: service_healthy
      presign-server:
        condition: service_healthy

  ollama:
    build:
      context: local-setup/ollama
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      - 11434:11434
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  qwen-tts:
    build:
      context: local-setup/qwen-tts
      dockerfile: Dockerfile
      args:
        QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
    ports:
      - 8001:8001
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: s3admin
      RUSTFS_SECRET_KEY: s3admin-secret
    ports:
      - "${S3_HOST_PORT:-9010}:9000" # host side only; kept off 9000, a common local-tooling default (e.g. Jupyter)
      - 9001:9001 # console UI
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  s3-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket ${S3_BUCKET:-beatrice-local} 2>/dev/null ||
        aws --endpoint-url http://s3:9000 s3 mb s3://${S3_BUCKET:-beatrice-local}

  presign-server:
    build:
      context: local-setup/presign-server
      dockerfile: Dockerfile
    environment:
      S3_ENDPOINT: s3:9000
      S3_ACCESS_KEY: s3admin
      S3_SECRET_KEY: s3admin-secret
      S3_BUCKET: ${S3_BUCKET:-beatrice-local}
    ports:
      - 8002:8002
    depends_on:
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - 5672:5672
      - 15672:15672 # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./local-setup/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - 4318:4318 # OTLP HTTP -- apps point OTEL__EXPORTER_OTLP_ENDPOINT to this port
      - 4317:4317 # OTLP gRPC -- Apps push traces via gRPC to this port

  otel-healthcheck:
    image: busybox:1.37
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - sh
      - -eu
      - -c
      - |
        for i in $$(seq 1 60); do
          if wget -S -qO- --timeout=3 http://otel-collector:13133/ 2>&1; then
            echo "otel-collector is healthy after $$i attempt(s)"
            exit 0
          fi
          echo "[$$i/60] otel-collector not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "ERROR: otel-collector did not become healthy within 120s" >&2
        exit 1

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 16686:16686 # UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
