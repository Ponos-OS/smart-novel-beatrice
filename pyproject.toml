[project]
name = "beatrice"
version = "5.1.1"
description = "LLM-powered features for smart-novel: word explanation, TTS text normalization. GraphQL over an OpenAI-compatible model backend."
requires-python = "==3.12.*"
license = { file = "LICENSE.md" }
authors = [{ name = "kasir-barati" }]

dependencies = [
    "fastapi>=0.115",
    "strawberry-graphql[fastapi,cli]>=0.243",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=0.0.14",
    "jinja2>=3.1",
    "httpx>=0.27",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "aio-pika>=10.0.1",
    "opentelemetry-instrumentation-aio-pika>=0.49b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-rerunfailures>=15.0",
    "httpx>=0.27",
    "testcontainers>=4.8",
    "boto3>=1.35",
    "ruff>=0.17.6",
    "ty>=0.0.109",
    "taplo>=0.9.3",
    "import-linter>=2.17",
    "conventional-pre-commit>=4.5.0",
    "pre-commit-hooks>=6.0.0",
    "nbstripout>=0.9.1",
    "pydantic-evals>=0.0.14",
    "pyyaml>=6.0",
    "flake8-aaa>=0.17.2",
    "ipykernel>=7.3.0",
    "pip>=26.2.1",
    "miniaudio>=1.71",
    "jscpd>=5.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",
    "W",       # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "C4",      # comprehensions
    "SIM",     # simplify
    "N",       # naming
    "RUF",     # ruff-specific
    "ISC001",  # implicitly concatenated strings on one line
    "ISC002",  # implicitly concatenated strings over a backslash continuation
    "PLC2701", # import-private-name (preview)
]
ignore = [
    "E501", # line-length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"**/*__test.py" = ["S101"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

# ---------------------------------------------------------------------------
# Import linter
# ---------------------------------------------------------------------------
# A package with a barrel `__init__.py` is "protected": outside it, import from the barrel, never a
# submodule. A new barrel package needs its own contract.
[tool.importlinter]
root_packages = ["src", "tests"]

[[tool.importlinter.contracts]]
name = "src never imports tests"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["tests"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "src.utils internals are private"
type = "protected"
protected_modules = ["src.utils.**"]
allowed_importers = ["src.utils", "src.utils.**"]

[[tool.importlinter.contracts]]
name = "src.modules.audio internals are private"
type = "protected"
protected_modules = ["src.modules.audio.**"]
allowed_importers = ["src.modules.audio", "src.modules.audio.**"]

[[tool.importlinter.contracts]]
name = "src.modules.explain_word internals are private"
type = "protected"
protected_modules = ["src.modules.explain_word.**"]
allowed_importers = ["src.modules.explain_word", "src.modules.explain_word.**"]

[[tool.importlinter.contracts]]
name = "src.modules.healthcheck internals are private"
type = "protected"
protected_modules = ["src.modules.healthcheck.**"]
allowed_importers = ["src.modules.healthcheck", "src.modules.healthcheck.**"]

[[tool.importlinter.contracts]]
name = "src.modules.normalize_tts internals are private"
type = "protected"
protected_modules = ["src.modules.normalize_tts.**"]
allowed_importers = ["src.modules.normalize_tts", "src.modules.normalize_tts.**"]

[[tool.importlinter.contracts]]
name = "tests.fixtures internals are private"
type = "protected"
protected_modules = ["tests.fixtures.**"]
allowed_importers = ["tests.fixtures", "tests.fixtures.**"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
python_files = ["*__test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["src", "tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--capture=tee-sys", # Capture stdout/stderr terminal in realtime.
]
asyncio_mode = "auto"
markers = ["integration: end-to-end tests that hit real services (Testcontainers, live HTTP)."]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["**/*__test.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
